<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!-- 파비콘 = 앱별 SVG(index.js 가 호스트/경로로 교체). CRA 기본 favicon.ico(React 로고)
         폴백 제거 — 그게 캐시되어 앱별 아이콘을 가리던 문제 차단(2026-06-08). -->
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/icons/admin.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 라이트 테마 고정: 브라우저/안드로이드 auto-dark(절전·시력보호)가 페이지를
         강제로 어둡게 칠해 카카오지도가 어둡게 보이던 것 차단(2026-06-22). 단말 자체
         절전모드가 화면 전체에 씌우는 필터는 웹이 못 푸는 영역(한계). -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#0066FF" />
    <meta name="description" content="통근버스 노선·실시간 차량 위치·QR 탑승 안내" />
    <!-- 링크 미리보기(카카오톡·슬랙 등 스크레이퍼용, 2026-08-28).
         🔴 이 태그는 **정적**이라 4개 앱·전 거래처가 같은 값을 쓴다 — 거래처 워드마크(카카오 T 등)를
            여기 박으면 다른 고객사 링크에도 그 이름이 찍힌다. 그래서 제품명 대신 **서비스 설명**을 쓴다.
            거래처 이름이 카드에 나와야 한다면 정적 HTML 로는 불가하고 거래처별 랜딩 주소가 필요하다.
         🔴 스크레이퍼는 JS 를 안 돌린다 — appIcons/EmployeeApp 의 런타임 제목 교체는 카드에 반영되지 않는다. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="통근셔틀 이용 안내" />
    <meta property="og:description" content="노선·정류장·실시간 차량 위치 확인과 QR 탑승을 링크 하나로" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BusLink" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/admin-1024.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>BusLink</title>
    <!-- 카카오맵 SDK -->
    <script type="text/javascript"
      src="//dapi.kakao.com/v2/maps/sdk.js?appkey=%REACT_APP_KAKAO_MAP_KEY%&libraries=services&autoload=false">
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
