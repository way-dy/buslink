<!-- /kakao — 2026-08-28 카카오모빌리티 시연용 거래처 전용 진입 주소였다.
     2026-09-15 시연 종료로 삼성전자 샘플 거래처를 지우면서 **중립 입구로 되돌렸다**:
     거래처 코드를 싣지 않고 승객앱 `/p` 로만 넘긴다. 카드 문구도 공용 index.html 과 같은 중립 문구다.
     🔴 파일·rewrite 는 지우지 말 것 — 이미 전달된 링크라서, 없애면 `/kakao` 가 SPA 캐치올로 떨어져
        관리자 로그인(`/`) 화면이 뜬다.
     🔴 실계약 거래처가 생겨 다시 전용 입구가 필요하면: 카드 태그를 그 거래처 표기로 바꾸고
        `to` 에 `?pc=<정식 업체코드>` 를 붙인다(2026-08-28 판본은 git 이력에 있다).
     🔴 리다이렉트는 JS 로만 — `meta refresh` 는 일부 스크레이퍼가 따라가 카드가 엉뚱하게 잡힌다. -->
